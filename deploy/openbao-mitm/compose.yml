# OpenBao + MITM proxy for Aster. Run from this directory; see README.md for the full procedure.
#
# Network layout (all user-defined, no published ports):
#   aster_vault         internal; openbao + mitm only        -> OpenBao :8200 is reachable only by mitm
#   aster_mitm_clients  internal; mitm + the Aster app only  -> proxy :14322 is reachable only by the app
#   aster_egress        mitm only; the path to the internet
#
# The app joins aster_mitm_clients through docker-compose.mitm.yml at the repository root, with a
# fixed address that the addon accepts (ASTER_PROXY_CLIENT_ALLOW) and a proxy token
# (ASTER_PROXY_TOKEN_FILE). mitm listens on its address on that network only, so the proxy port is
# not bound on aster_vault or aster_egress. Do not attach unrelated containers to these networks, and
# do not name the app's Compose project "aster".
name: aster

services:
  openbao:
    image: ${OPENBAO_IMAGE:?set OPENBAO_IMAGE to the pinned OpenBao image used in production}
    container_name: aster-openbao
    restart: unless-stopped
    command: ["server", "-config=/openbao/config/config.hcl"]
    environment:
      # CLI calls (docker exec ... bao, the health check) use the plaintext loopback listener.
      BAO_ADDR: http://127.0.0.1:8201
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
      # TLS material generated by bootstrap.sh: server certificate/key and the CA that signs the
      # client certificate held by aster-mitm. create_host_path: false makes a missing file a
      # startup error instead of a silently created empty directory.
      - type: bind
        source: ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/tls/ca.pem
        target: /openbao/tls/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/tls/server.pem
        target: /openbao/tls/server.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/tls/server-key.pem
        target: /openbao/tls/server-key.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Loopback listener; exit 0 only when unsealed.
      test: ["CMD", "bao", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      vault:
        ipv4_address: 10.89.82.2

  mitm:
    image: ${MITMPROXY_IMAGE:?set MITMPROXY_IMAGE to the pinned mitmproxy image used in production}
    container_name: aster-mitm
    restart: unless-stopped
    # -q keeps request URLs out of the log: the Telegram token is in the URL path after substitution.
    entrypoint: ["mitmdump"]
    command:
      - "-q"
      - "--listen-host"
      # Bound to the aster_mitm_clients interface only; not 0.0.0.0.
      - "10.89.143.2"
      - "--listen-port"
      - "14322"
      - "--set"
      # Drop idle client and upstream connections instead of holding them open indefinitely.
      - "connection_timeout=30"
      - "--set"
      - "confdir=/home/mitmproxy/.mitmproxy"
      - "-s"
      - "/addon/aster_vault_addon.py"
    environment:
      # OpenBao's network listener is TLS + mutual TLS; the addon holds the client certificate.
      OPENBAO_ADDR: https://aster-openbao:8200
      OPENBAO_TOKEN_FILE: /run/secrets/openbao-mitm-token
      OPENBAO_CA_FILE: /run/secrets/openbao-tls/ca.pem
      OPENBAO_CLIENT_CERT_FILE: /run/secrets/openbao-tls/client.pem
      OPENBAO_CLIENT_KEY_FILE: /run/secrets/openbao-tls/client-key.pem
      ASTER_VAULT_ALLOWLIST: /addon/allowlist.json
      # Second gate on top of the dedicated network: only the Aster app container may use the proxy.
      ASTER_PROXY_CLIENT_ALLOW: ${ASTER_PROXY_CLIENT_ALLOW:-10.89.143.3/32}
      # Third gate: every client must present Proxy-Authorization (Basic aster:<token>).
      ASTER_PROXY_TOKEN_FILE: /run/secrets/mitm-proxy-token
      # The addon reads OpenBao directly; it must not send that traffic through itself.
      NO_PROXY: aster-openbao,localhost,127.0.0.1
    volumes:
      - ./addon:/addon:ro
      # Host-only directory: holds the CA private key (mitmproxy-ca.pem) and the CA certificate.
      - ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/mitmproxy:/home/mitmproxy/.mitmproxy
      # Read-only OpenBao token with the aster-mitm-read policy only (see bootstrap.sh).
      - type: bind
        source: ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/openbao-mitm-token
        target: /run/secrets/openbao-mitm-token
        read_only: true
        bind:
          create_host_path: false
      # mTLS material for the addon's OpenBao reads (bootstrap.sh).
      - type: bind
        source: ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/tls/ca.pem
        target: /run/secrets/openbao-tls/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/tls/client.pem
        target: /run/secrets/openbao-tls/client.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/tls/client-key.pem
        target: /run/secrets/openbao-tls/client-key.pem
        read_only: true
        bind:
          create_host_path: false
      # Proxy authentication token shared with the app (bootstrap.sh generates it).
      - type: bind
        source: ${ASTER_OPENBAO_SECRETS:?set ASTER_OPENBAO_SECRETS to the absolute path of the secrets directory}/mitm-proxy-token
        target: /run/secrets/mitm-proxy-token
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    networks:
      vault:
        ipv4_address: 10.89.82.3
      clients:
        ipv4_address: 10.89.143.2
      egress:

volumes:
  openbao-data:

networks:
  # OpenBao <-> MITM only. internal: no route off the host, so even a mistake in OPENBAO_ADDR
  # cannot send vault traffic to the internet.
  vault:
    name: aster_vault
    internal: true
    ipam:
      config:
        - subnet: 10.89.82.0/24
  # Aster app <-> MITM only. internal: the app has no direct route out and must use the proxy.
  clients:
    name: aster_mitm_clients
    internal: true
    ipam:
      config:
        - subnet: 10.89.143.0/24
  # MITM-only outbound path to model providers and Telegram.
  egress:
    name: aster_egress
