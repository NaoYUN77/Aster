# Schema authority: broker/api_policy.go.in (APIPolicy/APIRule + strict loader).
# Copy to private/api-policy.yaml. Use the authenticated vault names from your
# broker, keep only operations actually needed, then restart the broker.
# Exact target/method/path tuples only; no wildcard or prefix matching.
# Paths are checked BEFORE secret substitution. Never put real bot tokens here.
# This example covers Telegram polling/reply and Anthropic Messages only.
# Other providers/tools require explicit reviewed operations and validation.
version: 1
rules:
  - vault: personal-agent
    target: api.telegram.org:443
    method: POST
    path: /bot__vault_TELEGRAM_BOT_TOKEN__/getMe
  - vault: personal-agent
    target: api.telegram.org:443
    method: POST
    path: /bot__vault_TELEGRAM_BOT_TOKEN__/deleteWebhook
  - vault: personal-agent
    target: api.telegram.org:443
    method: POST
    path: /bot__vault_TELEGRAM_BOT_TOKEN__/getUpdates
  - vault: personal-agent
    target: api.telegram.org:443
    method: POST
    path: /bot__vault_TELEGRAM_BOT_TOKEN__/sendMessage
  - vault: personal-agent
    target: api.anthropic.com:443
    method: POST
    path: /v1/messages
