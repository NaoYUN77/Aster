services:
  personal-agent:
    image: ${ASTER_IMAGE:-aster:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - personal-agent-data:/data
    mem_limit: 1g
    pids_limit: 128
    init: true
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  personal-agent-data:
    # Keep the deployed volume name across the Aster image rename.
    name: personal-agent-data
