# Standalone file: do not merge with docker-compose.yml (which grants direct network access).
# Every host-visible resource name, the subnet, the broker address and the management port come
# from the validated environment description (see docs/deployment-environments.md). The defaults
# match the production environment; a test deployment sets ASTER_* values from its own file.
services:
  agent-vault:
    image: ${ASTER_VAULT_IMAGE:-aster-vault:local}
    restart: unless-stopped
    env_file: ${ASTER_PRIVATE_DIR:-./deploy/agent-vault/private}/vault.env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${AGENT_VAULT_MASTER_PASSWORD:?Set the Vault master password}"
        : "$${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:?Set the Infisical client ID}"
        : "$${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:?Set the Infisical client secret}"
        exec /usr/local/bin/docker-entrypoint.sh server --host 0.0.0.0 --port ${ASTER_BROKER_MANAGEMENT_PORT:-14321}
    environment:
      INFISICAL_URL: https://app.infisical.com
      AGENT_VAULT_TELEMETRY: "false"
      ASTER_VAULT_API_POLICY: /etc/aster-vault/api-policy.yaml
    # Management port stays unpublished unless a loopback override adds it; see
    # docker-compose.management-loopback.yml. Never bind it to a public interface.
    expose:
      - "${ASTER_BROKER_MANAGEMENT_PORT:-14321}"
    volumes:
      - agent-vault-data:/data
      - type: bind
        source: ${ASTER_PRIVATE_DIR:-./deploy/agent-vault/private}/api-policy.yaml
        target: /etc/aster-vault/api-policy.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      vault:
        ipv4_address: ${ASTER_BROKER_ADDRESS:-172.30.82.2}
    mem_limit: 512m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tool-network:
    image: ${ASTER_NETWORK_IMAGE:-aster-network:local}
    # A fixed, non-restarting namespace: recreate app and network together after a failure.
    restart: "no"
    environment:
      # Both values feed iptables in network.sh; they are the same validated environment values.
      ASTER_BROKER_ADDRESS: ${ASTER_BROKER_ADDRESS:-172.30.82.2}
      ASTER_BROKER_PORT: ${ASTER_BROKER_PORT:-14322}
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=1m"]
    networks: ["vault"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 1s
      retries: 5
    mem_limit: 32m
    pids_limit: 16

  personal-agent:
    image: ${ASTER_IMAGE:-aster:local}
    restart: unless-stopped
    user: "1000:1000"
    env_file: ${ASTER_PRIVATE_DIR:-./deploy/agent-vault/private}/app.env
    environment:
      DATA_DIR: /data
      AGENT_VAULT_ENABLED: "1"
      NODE_USE_ENV_PROXY: "1"
      NODE_EXTRA_CA_CERTS: /etc/agent-vault/ca.pem
      NO_PROXY: localhost,127.0.0.1,::1
    network_mode: "service:tool-network"
    depends_on:
      tool-network: { condition: service_healthy }
      agent-vault: { condition: service_healthy }
    volumes:
      - personal-agent-data:/data
      - ${ASTER_PRIVATE_DIR:-./deploy/agent-vault/private}/ca.pem:/etc/agent-vault/ca.pem:ro
    # Exported from Infisical at deploy time; the running process never holds the Infisical identity.
    # File secrets are bind-mounted with the source permissions, so keep this file readable by uid 1000.
    secrets:
      - telegram-owner-id
    read_only: true
    tmpfs: ["/tmp:size=128m,uid=1000,gid=1000"]
    mem_limit: 1g
    pids_limit: 128
    init: true
    stop_grace_period: 45s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  vault:
    # Set ASTER_NETWORK_NAME from the environment description to pin the name. Without it Compose
    # derives "<project>_vault", which is already environment-unique; a deployment that already
    # owns a network under another name must record that name rather than create a second one.
    name: ${ASTER_NETWORK_NAME:-}
    ipam:
      config:
        - subnet: ${ASTER_VAULT_SUBNET:-172.30.82.0/24}

volumes:
  personal-agent-data:
    name: ${ASTER_APP_VOLUME:-personal-agent-data}
  agent-vault-data:
    name: ${ASTER_BROKER_VOLUME:-personal-agent-vault-data}

secrets:
  telegram-owner-id:
    file: ${ASTER_PRIVATE_DIR:-./deploy/agent-vault/private}/telegram-owner-id
